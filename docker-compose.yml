services:
  app:
    image: sampleagent:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-2025}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URI: "postgres://sampleagent:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/sampleagent?sslmode=disable"
      REDIS_URI: "redis://redis:6379/0"
      REDIS_URL: "redis://redis:6379/1"
      RAG_UPLOAD_DIR: "/data/uploads"
      CACHEABLE_TOOLS: "${CACHEABLE_TOOLS:-search_uploaded_knowledge}"
      LANGGRAPH_CLOUD_LICENSE_KEY: "${LANGGRAPH_CLOUD_LICENSE_KEY:-}"
      LANGSMITH_TRACING: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - rag_uploads:/data/uploads
    restart: unless-stopped

  worker:
    image: sampleagent:local
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "RAG.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URI: "postgres://sampleagent:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/sampleagent?sslmode=disable"
      REDIS_URL: "redis://redis:6379/1"
      RAG_UPLOAD_DIR: "/data/uploads"
      LANGSMITH_TRACING: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - rag_uploads:/data/uploads
    restart: unless-stopped
    # The API image has an HTTP healthcheck; this worker does not serve HTTP.
    healthcheck:
      disable: true

  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    ports:
      - "127.0.0.1:2125:5432"
    environment:
      POSTGRES_DB: sampleagent
      POSTGRES_USER: sampleagent
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sampleagent -d sampleagent"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:2126:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rag_uploads:
