map "$request_method:$http_origin:$http_access_control_request_private_network" $studio_pna_preflight {
    default 0;
    "OPTIONS:https://smith.langchain.com:true" 1;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8000;
    server_name _;

    location / {
        if ($studio_pna_preflight) {
            add_header Access-Control-Allow-Origin "https://smith.langchain.com" always;
            add_header Access-Control-Allow-Methods "DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT" always;
            add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
            add_header Access-Control-Allow-Private-Network "true" always;
            add_header Access-Control-Max-Age "600" always;
            add_header Vary "Origin" always;
            return 204;
        }

        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
